<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE4D6"/>
      <stop offset="100%" stop-color="#FFD4C1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E2D12"/>
      <stop offset="100%" stop-color="#A43716"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F5F0EB"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8E2D12" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Body -->
  <ellipse cx="60" cy="90" rx="42" ry="35" fill="url(#bodyGrad)" filter="url(#shadow)"/>
  <!-- Head -->
  <circle cx="60" cy="48" r="32" fill="url(#bodyGrad)" filter="url(#shadow)"/>
  <!-- Devanagari म on belly -->
  <text x="60" y="97" font-family="'Noto Sans Devanagari', 'Mukta', sans-serif" font-size="48" font-weight="700" fill="url(#accentGrad)" text-anchor="middle" dominant-baseline="middle">म</text>
  <!-- Eyes - focused reading -->
  <ellipse cx="48" cy="42" rx="6" ry="7" fill="#2D1B15"/>
  <ellipse cx="47" cy="40" rx="2" ry="2" fill="#fff"/>
  <ellipse cx="72" cy="42" rx="6" ry="7" fill="#2D1B15"/>
  <ellipse cx="71" cy="40" rx="2" ry="2" fill="#fff"/>
  <!-- Eyebrows slightly furrowed (focused) -->
  <path d="M42 34 Q48 36 54 34" stroke="#2D1B15" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M66 34 Q72 36 78 34" stroke="#2D1B15" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Cheeks subtle -->
  <ellipse cx="38" cy="52" rx="4" ry="2.5" fill="#FFB3A0" opacity="0.4"/>
  <ellipse cx="82" cy="52" rx="4" ry="2.5" fill="#FFB3A0" opacity="0.4"/>
  <!-- Small concentrated smile -->
  <path d="M50 56 Q60 58 70 56" stroke="#8E2D12" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Book in hands -->
  <rect x="30" y="65" width="60" height="50" rx="3" fill="url(#bookGrad)" stroke="#E8DCC8" stroke-width="1.5" filter="url(#shadow)">
    <animate attributeName="y" values="65;63;65" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
  </rect>
  <!-- Book spine -->
  <rect x="30" y="65" width="4" height="50" fill="#8E2D12" opacity="0.3">
    <animate attributeName="y" values="65;63;65" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
  </rect>
  <!-- Book pages lines -->
  <g stroke="#E8DCC8" stroke-width="1" opacity="0.6">
    <line x1="36" y1="72" x2="84" y2="72">
      <animate attributeName="y1" values="72;70;72" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
      <animate attributeName="y2" values="72;70;72" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </line>
    <line x1="36" y1="80" x2="84" y2="80">
      <animate attributeName="y1" values="80;78;80" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
      <animate attributeName="y2" values="80;78;80" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </line>
    <line x1="36" y1="88" x2="84" y2="88">
      <animate attributeName="y1" values="88;86;88" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
      <animate attributeName="y2" values="88;86;88" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </line>
    <line x1="36" y1="96" x2="84" y2="96">
      <animate attributeName="y1" values="96;94;96" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
      <animate attributeName="y2" values="96;94;96" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </line>
  </g>
  <!-- Arms holding book -->
  <path d="M18 80 Q28 75 36 72" stroke="url(#bodyGrad)" stroke-width="16" fill="none" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M102 80 Q92 75 84 72" stroke="url(#bodyGrad)" stroke-width="16" fill="none" stroke-linecap="round" filter="url(#shadow)"/>
  <!-- Hands on book -->
  <circle cx="18" cy="80" r="8" fill="url(#bodyGrad)" filter="url(#shadow)"/>
  <circle cx="102" cy="80" r="8" fill="url(#bodyGrad)" filter="url(#shadow)"/>
  <!-- Feet -->
  <ellipse cx="42" cy="115" rx="12" ry="8" fill="url(#accentGrad)"/>
  <ellipse cx="78" cy="115" rx="12" ry="8" fill="url(#accentGrad)"/>
</svg>