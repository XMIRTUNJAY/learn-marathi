<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE4D6"/>
      <stop offset="100%" stop-color="#FFD4C1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E2D12"/>
      <stop offset="100%" stop-color="#A43716"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8E2D12" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Body -->
  <ellipse cx="60" cy="85" rx="42" ry="35" fill="url(#bodyGrad)" filter="url(#shadow)"/>
  <!-- Head -->
  <circle cx="60" cy="45" r="32" fill="url(#bodyGrad)" filter="url(#shadow)"/>
  <!-- Devanagari म on belly -->
  <text x="60" y="92" font-family="'Noto Sans Devanagari', 'Mukta', sans-serif" font-size="48" font-weight="700" fill="url(#accentGrad)" text-anchor="middle" dominant-baseline="middle">म</text>
  <!-- Eyes - relaxed/happy -->
  <ellipse cx="48" cy="38" rx="6" ry="7" fill="#2D1B15"/>
  <ellipse cx="46" cy="36" rx="2" ry="2" fill="#fff"/>
  <ellipse cx="72" cy="38" rx="6" ry="7" fill="#2D1B15"/>
  <ellipse cx="70" cy="36" rx="2" ry="2" fill="#fff"/>
  <!-- Eyebrows -->
  <path d="M40 30 Q48 28 56 30" stroke="#2D1B15" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M64 30 Q72 28 80 30" stroke="#2D1B15" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <ellipse cx="38" cy="50" rx="5" ry="3" fill="#FFB3A0" opacity="0.6"/>
  <ellipse cx="82" cy="50" rx="5" ry="3" fill="#FFB3A0" opacity="0.6"/>
  <!-- Smile -->
  <path d="M48 54 Q60 62 72 54" stroke="#8E2D12" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Arms -->
  <path d="M18 75 Q30 85 42 80" stroke="url(#bodyGrad)" stroke-width="18" fill="none" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M102 75 Q90 85 78 80" stroke="url(#bodyGrad)" stroke-width="18" fill="none" stroke-linecap="round" filter="url(#shadow)"/>
  <!-- Hands -->
  <circle cx="18" cy="75" r="9" fill="url(#bodyGrad)" filter="url(#shadow)"/>
  <circle cx="102" cy="75" r="9" fill="url(#bodyGrad)" filter="url(#shadow)"/>
  <!-- Feet -->
  <ellipse cx="42" cy="112" rx="12" ry="8" fill="url(#accentGrad)"/>
  <ellipse cx="78" cy="112" rx="12" ry="8" fill="url(#accentGrad)"/>
</svg>