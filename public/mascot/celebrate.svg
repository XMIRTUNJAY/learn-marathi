<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE4D6"/>
      <stop offset="100%" stop-color="#FFD4C1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E2D12"/>
      <stop offset="100%" stop-color="#A43716"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8E2D12" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Confetti burst -->
  <g filter="url(#glow)">
    <circle cx="60" cy="60" r="5" fill="url(#goldGrad)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-30 -50;-60 -100" dur="1.5s" repeatCount="indefinite" begin="0s" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0" dur="1.5s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="60" cy="60" r="4" fill="#8E2D12">
      <animateTransform attributeName="transform" type="translate" values="0 0;35 -45;70 -90" dur="1.5s" repeatCount="indefinite" begin="0.2s" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
    <circle cx="60" cy="60" r="5" fill="#FFD700">
      <animateTransform attributeName="transform" type="translate" values="0 0;-40 -30;-80 -60" dur="1.5s" repeatCount="indefinite" begin="0.4s" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0" dur="1.5s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    <circle cx="60" cy="60" r="3.5" fill="#A43716">
      <animateTransform attributeName="transform" type="translate" values="0 0;40 -25;80 -50" dur="1.5s" repeatCount="indefinite" begin="0.6s" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="60" cy="60" r="4.5" fill="#FFD700">
      <animateTransform attributeName="transform" type="translate" values="0 0;-25 -55;-50 -110" dur="1.5s" repeatCount="indefinite" begin="0.8s" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0" dur="1.5s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle cx="60" cy="60" r="4" fill="#8E2D12">
      <animateTransform attributeName="transform" type="translate" values="0 0;30 -55;60 -110" dur="1.5s" repeatCount="indefinite" begin="1s" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0" dur="1.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>
  <!-- Stars -->
  <g fill="url(#goldGrad)">
    <polygon points="60,20 62,28 70,30 64,36 66,44 60,40 54,44 56,36 50,30 58,28">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="30,35 31.5,39.5 36.5,40 32.5,43 34,48 30,45 26,48 27.5,43 23.5,40 28.5,39.5">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite" begin="0.2s"/>
    </polygon>
    <polygon points="90,35 91.5,39.5 96.5,40 92.5,43 94,48 90,45 86,48 87.5,43 83.5,40 88.5,39.5">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite" begin="0.4s"/>
    </polygon>
  </g>
  <!-- Body (jumping) -->
  <ellipse cx="60" cy="90" rx="42" ry="30" fill="url(#bodyGrad)" filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="0.6s" repeatCount="indefinite" values="0 0;0 -8;0 0" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </ellipse>
  <!-- Head (jumping) -->
  <circle cx="60" cy="48" r="32" fill="url(#bodyGrad)" filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="0.6s" repeatCount="indefinite" values="0 0;0 -8;0 0" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>
  <!-- Devanagari म on belly -->
  <text x="60" y="97" font-family="'Noto Sans Devanagari', 'Mukta', sans-serif" font-size="48" font-weight="700" fill="url(#accentGrad)" text-anchor="middle" dominant-baseline="middle">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="0.6s" repeatCount="indefinite" values="0 0;0 -8;0 0" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    म
  </text>
  <!-- Eyes - super happy -->
  <ellipse cx="46" cy="38" rx="8" ry="6" fill="#2D1B15">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="0.6s" repeatCount="indefinite" values="0 0;0 -8;0 0" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </ellipse>
  <ellipse cx="44" cy="36" rx="2.5" ry="2.5" fill="#fff">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="0.6s" repeatCount="indefinite" values="0 0;0 -8;0 0" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </ellipse>
  <ellipse cx="74" cy="38" rx="8" ry="6" fill="#2D1B15">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="0.6s" repeatCount="indefinite" values="0 0;0 -8;0 0" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </ellipse>
  <ellipse cx="72" cy="36" rx="2.5" ry="2.5" fill="#fff">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="0.6s" repeatCount="indefinite" values="0 0;0 -8;0 0" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </ellipse>
  <!-- Eyebrows raised high -->
  <path d="M36 28 Q48 20 60 28" stroke="#2D1B15" stroke-width="3" fill="none" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="0.6s" repeatCount="indefinite" values="0 0;0 -8;0 0" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </path>
  <path d="M60 28 Q72 20 84 28" stroke="#2D1B15" stroke-width="3" fill="none" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="0.6s" repeatCount="indefinite" values="0 0;0 -8;0 0" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </path>
  <!-- Cheeks bright -->
  <ellipse cx="35" cy="50" rx="7" ry="4" fill="#FF8A65" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="0.6s" repeatCount="indefinite" values="0 0;0 -8;0 0" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </ellipse>
  <ellipse cx="85" cy="50" rx="7" ry="4" fill="#FF8A65" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="0.6s" repeatCount="indefinite" values="0 0;0 -8;0 0" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </ellipse>
  <!-- Big open smile -->
  <path d="M42 54 Q60 70 78 54" stroke="#8E2D12" stroke-width="4" fill="none" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="0.6s" repeatCount="indefinite" values="0 0;0 -8;0 0" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </path>
  <!-- Arms up in celebration -->
  <path d="M18 75 Q20 40 30 30" stroke="url(#bodyGrad)" stroke-width="18" fill="none" stroke-linecap="round" filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="0.6s" repeatCount="indefinite" values="0 0;0 -8;0 0" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </path>
  <path d="M102 75 Q100 40 90 30" stroke="url(#bodyGrad)" stroke-width="18" fill="none" stroke-linecap="round" filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="0.6s" repeatCount="indefinite" values="0 0;0 -8;0 0" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </path>
  <!-- Hands up -->
  <circle cx="18" cy="75" r="9" fill="url(#bodyGrad)" filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="0.6s" repeatCount="indefinite" values="0 0;0 -8;0 0" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>
  <circle cx="102" cy="75" r="9" fill="url(#bodyGrad)" filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="0.6s" repeatCount="indefinite" values="0 0;0 -8;0 0" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>
  <!-- Feet (tucked up) -->
  <ellipse cx="42" cy="110" rx="12" ry="8" fill="url(#accentGrad)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="0.6s" repeatCount="indefinite" values="0 0;0 -8;0 0" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </ellipse>
  <ellipse cx="78" cy="110" rx="12" ry="8" fill="url(#accentGrad)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="0.6s" repeatCount="indefinite" values="0 0;0 -8;0 0" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </ellipse>
</svg>